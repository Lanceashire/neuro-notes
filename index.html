    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroNotes Prototype</title>

      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],

  </head>

    <div id="root"></div>
